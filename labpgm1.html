<!DOCTYPE html>
<html>
<head>
<title>Event Registration</title>
<style>
body {
font-family: Arial;
background: #f4f4f3;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
form {
background: white;
padding: 20px;
border-radius: 8px;
box-shadow: 0 0 10px #bbb;
width: 300px;
}
h2 {
color: #333;
}
div {
margin: 15px 0;
}
label {
display: block;
color: #555;
margin-bottom: 5px;
}
input, select, button {
width: 100%;
padding: 8px;
box-sizing: border-box;

}
input, select {
border: 1px solid #ddd;
border-radius: 10px;
}
button {
padding: 10px;
background: #28a745;
color: white;
border: 0;
border-radius: 4px;
font-size: 16px;
}
</style>
</head>
<body>
<form>
<h2>Event Registration</h2>
<div>
<label>Full Name</label>
<input type="text" required>
</div>
<div>
<label>Email</label>
<input type="email" required>
</div>
<div>
<label>Phone Number</label>
<input type="tel" required>
</div>
<div>
<label>Event</label>
<select required>
<option>Select Event</option>

<option>Paper Presentation</option>
<option>Poster Presentation</option>
<option>Project Expo</option>
</select>
</div>
<button>Register</button>
</form>
</body>
</html>
